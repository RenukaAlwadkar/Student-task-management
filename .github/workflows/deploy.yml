name: Deploy Student Task Manager via Terraform IaC

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-ci-cd:
    name: Terraform Lint, Plan & Automated Deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # Step 1: Checkout the code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Terraform CLI
      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Step 3: Check Terraform formatting (Step 13)
      - name: Check Terraform Format
        id: fmt
        run: terraform fmt -check

      # Step 4: Verify Secret Configuration in GitHub Repository
      - name: Verify Cloudflare Secrets Configuration
        run: |
          echo "Verifying Cloudflare Secrets configuration..."
          MISSING=0
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error title=Missing Secret::GitHub Secret 'CLOUDFLARE_ACCOUNT_ID' is empty or not set."
            MISSING=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID: [CONFIGURED]"
          fi

          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing Secret::GitHub Secret 'CLOUDFLARE_API_TOKEN' is empty or not set."
            MISSING=1
          else
            echo "CLOUDFLARE_API_TOKEN: [CONFIGURED]"
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "Please set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN under GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Step 5: Initialize Terraform backend and download Cloudflare provider (Step 12)
      - name: Terraform Init
        id: init
        run: terraform init -input=false

      # Step 6: Validate Terraform configuration syntax (Step 14)
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Step 6.5: Sync Existing Cloudflare Infrastructure (prevents duplicate resource conflicts)
      - name: Sync Existing Cloudflare Infrastructure State
        run: |
          echo "Checking for existing Cloudflare KV namespace and Worker..."
          KV_DATA=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          
          KV_ID=$(echo "$KV_DATA" | jq -r '.result[]? | select(.title=="student_tasks") | .id' 2>/dev/null || true)
          
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "Discovered existing KV namespace ID: $KV_ID. Adopting into Terraform state..."
            terraform import cloudflare_workers_kv_namespace.student_tasks "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/$KV_ID" || true
            terraform import cloudflare_workers_script.student_task_manager "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/student-task-manager" || true
          else
            echo "No existing resources found on Cloudflare. Fresh deployment will be provisioned."
          fi

      # Step 7: Generate Execution Plan (Step 15)
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color

      # Step 8: Apply Infrastructure Changes automatically on push to main/master (Step 16)
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: terraform apply -auto-approve tfplan
