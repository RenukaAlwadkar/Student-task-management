name: Deploy Student Task Manager via Terraform IaC

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-ci-cd:
    name: Terraform Lint, Plan & Automated Deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Checkout the code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Terraform CLI
      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Step 3: Check Terraform formatting (Step 13)
      - name: Check Terraform Format
        id: fmt
        run: terraform fmt -check

      # Step 4: Initialize Terraform backend and download Cloudflare provider (Step 12)
      - name: Terraform Init
        id: init
        run: terraform init

      # Step 5: Validate Terraform configuration syntax (Step 14)
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Step 6: Generate Execution Plan (Step 15)
      - name: Terraform Plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -out=tfplan -no-color

      # Step 7: Apply Infrastructure Changes automatically on push to main (Step 16)
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve tfplan
